[project]
name = "nucleant-bootstraps"
version = "0.1.0"
description = "Platform project generators (Gradle, Xcode, SwiftPM) used by NucleantProject."
readme = "README.md"
license = "MIT"
authors = [
    { name = "NucleantUI" },
]
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[build-system]
requires = ["uv_build>=0.11.14,<0.13.0"]
build-backend = "uv_build"
